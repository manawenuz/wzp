# Standalone featherChat interop test crate (not a workspace member).
# Requires the deps/featherchat submodule:
#   git submodule update --init deps/featherchat
#   cargo test --manifest-path tests/featherchat-compat/Cargo.toml
[package]
name = "wzp-featherchat-compat"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dev-dependencies]
warzone-protocol = { path = "../../deps/featherchat/warzone/crates/warzone-protocol" }
wzp-proto = { path = "../../crates/wzp-proto" }
wzp-crypto = { path = "../../crates/wzp-crypto" }
wzp-client = { path = "../../crates/wzp-client" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
