[package]
name = "wzp-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WarzonePhone crypto layer — X25519 + ChaCha20-Poly1305, Warzone identity compatible"

[dependencies]
wzp-proto = { workspace = true }
x25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
bip39 = "2"
hex = "0.4"

# featherChat (warzone-protocol) interop is verified by the standalone crate in
# tests/featherchat-compat, which needs the deps/featherchat submodule. It is
# kept out of this manifest so the workspace builds without the submodule.

[dev-dependencies]
ed25519-dalek = { workspace = true }
wzp-proto = { workspace = true }
wzp-client = { path = "../wzp-client" }
wzp-relay = { path = "../wzp-relay" }
serde_json = "1"
serde = { workspace = true }
bincode = "1"
