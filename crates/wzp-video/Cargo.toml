[package]
name = "wzp-video"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytes = { workspace = true }
tracing = { workspace = true }
wzp-proto = { path = "../wzp-proto" }

# AV1 SW codecs: shiguredo crates download prebuilt binaries at build time.
# Prebuilts are available for macOS arm64 only (no macos_x86_64 archive is
# published), so on Intel Macs the AV1 SW path is compiled out and AV1 falls
# back to VideoToolbox / NotInitialized. Android uses MediaCodec; Linux will
# use system/vendored libs when that path is wired up (TODO).
[target.'cfg(target_os = "macos")'.dependencies]
shiguredo_video_toolbox = "2026.1"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
shiguredo_dav1d = "2026.1.0"
shiguredo_svt_av1 = "2026.1.0"

# Android MediaCodec backend is opt-in (`--features wzp-video/mediacodec`):
# src/mediacodec.rs was written against an older `ndk` API and does not yet
# compile with ndk 0.9 (see docs/HANDOFF-2026-05-12.md, T4.3.1.1). Without the
# feature, Android builds get the same NotInitialized stubs as Linux/Windows,
# so the Tauri Android app still builds (video is simply unavailable there).
[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", features = ["api-level-28", "media"], optional = true }

[features]
default = []
mediacodec = ["dep:ndk"]

[dev-dependencies]
rand = "0.8"
