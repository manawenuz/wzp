name: Rust

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # deps/featherchat is only needed for the optional interop tests in
    # tests/featherchat-compat. Its .gitmodules URL is SSH on a private port,
    # so try the public HTTPS endpoint; the build does not depend on it.
    - name: Fetch featherchat submodule (optional)
      id: featherchat
      continue-on-error: true
      run: |
        git config --global url."https://git.manko.yoga/".insteadOf "ssh://git@git.manko.yoga:222/"
        timeout 120 git submodule update --init --recursive
        test -f deps/featherchat/warzone/crates/warzone-protocol/Cargo.toml

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake pkg-config libasound2-dev ninja-build

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    # Only the relay / CLI / web / bench binaries are built here, matching the
    # upstream release pipeline. The workspace also contains Android-only
    # crates (wzp-android, wzp-native, wzp-video) and the Tauri desktop app,
    # which need the NDK / webkit toolchains and are built by scripts/.
    - name: Build
      run: cargo build --release --locked -p wzp-relay -p wzp-client -p wzp-web --bin wzp-relay --bin wzp-client --bin wzp-bench --bin wzp-web

    - name: Run tests
      run: cargo test --release --locked -p wzp-proto -p wzp-codec -p wzp-fec -p wzp-crypto -p wzp-transport -p wzp-relay -p wzp-client -p wzp-web --lib

    - name: featherChat interop tests
      if: steps.featherchat.outcome == 'success'
      run: cargo test --release --manifest-path tests/featherchat-compat/Cargo.toml

    - name: Package
      run: |
        mkdir -p dist
        tar czf dist/wzp-linux-amd64.tar.gz -C target/release wzp-relay wzp-client wzp-web wzp-bench
        (cd dist && sha256sum wzp-linux-amd64.tar.gz > wzp-linux-amd64.tar.gz.sha256)
        ls -lh dist

    - uses: actions/upload-artifact@v4
      with:
        name: wzp-linux-amd64
        path: dist/*

    - name: Publish GitHub release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${GITHUB_REF_NAME}" dist/* \
          --title "WarzonePhone ${GITHUB_REF_NAME}" \
          --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
