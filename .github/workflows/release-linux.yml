name: Release Linux

on:
  push:
    tags: [ "v*" ]
    branches:
      - main
    paths-ignore: [ "**.md", "docs/**" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    env:
      # linuxdeploy (used by the AppImage bundler) is itself an AppImage;
      # GitHub runners have no FUSE, so let it self-extract instead.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # linuxdeploy ships an old `strip` that chokes on .relr.dyn sections
      # produced by Ubuntu 24.04's toolchain.
      NO_STRIP: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config clang file patchelf \
            libssl-dev libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libwebrtc-audio-processing-dev \
            libfuse2t64 xdg-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Determine version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(jq -r .version desktop/src-tauri/tauri.conf.json)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      # ── CLI / relay binaries ────────────────────────────────────────────
      - name: Build CLI / relay binaries
        run: >
          cargo build --release --locked
          -p wzp-relay -p wzp-client -p wzp-web
          --bin wzp-relay --bin wzp-client --bin wzp-bench --bin wzp-web

      # ── Desktop app (Tauri) ─────────────────────────────────────────────
      # linux-aec links the system WebRTC audio-processing library (0.3 line)
      # for in-process echo cancellation.
      - name: Build desktop bundles (deb, rpm, AppImage)
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx tauri build --features linux-aec --verbose -- --locked

      - name: Collect artifacts
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          ver="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          bundle=target/release/bundle
          ls -R "$bundle" | head -50 || true

          tar czf "dist/wzp-cli-linux-${arch}.tar.gz" -C target/release \
            wzp-relay wzp-client wzp-web wzp-bench

          for f in "$bundle"/deb/*.deb; do
            cp "$f" "dist/WarzonePhone_${ver}_linux_${arch}.deb"
          done
          for f in "$bundle"/rpm/*.rpm; do
            cp "$f" "dist/WarzonePhone_${ver}_linux_${arch}.rpm"
          done
          for f in "$bundle"/appimage/*.AppImage; do
            [ -e "$f" ] || continue
            cp "$f" "dist/WarzonePhone_${ver}_linux_${arch}.AppImage"
          done

          (cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: wzp-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3 4 5; do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
              gh release create "$GITHUB_REF_NAME" --title "WarzonePhone $GITHUB_REF_NAME" --generate-notes || true
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber && break
            sleep $((i*10))
          done
